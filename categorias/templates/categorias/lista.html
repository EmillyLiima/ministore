{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Categorias</h2>
    <a href="{{ url_for('categorias.novo') }}" class="btn btn-primary">
        + Nova Categoria
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Descrição</th>
                    <th scope="col" class="text-end">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for categoria in categorias %}
                <tr>
                    <td>{{ categoria.id }}</td>
                    <td><strong>{{ categoria.nome }}</strong></td>
                    <td>{{ categoria.descricao or '-' }}</td>
                    <td class="text-end">
                        <a href="{{ url_for('categorias.editar', id=categoria.id) }}" class="btn btn-sm btn-outline-secondary me-1">
                            Editar
                        </a>
                        <form action="{{ url_for('categorias.excluir', id=categoria.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Tem a certeza que deseja eliminar esta categoria?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                Excluir
                            </button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center text-muted py-4">
                        Nenhuma categoria cadastrada.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
